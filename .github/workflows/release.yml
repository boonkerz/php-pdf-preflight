# Release: push a tag vX.Y.Z (after bumping the versions, see docs/release.md).
#
# * GitHub release with all extension builds and SHA256SUMS
# * GHCR images ghcr.io/<owner>/php-pdf-preflight:<version>-php<x.y>[-zts|-alpine]
#   (multi-arch amd64/arm64, containing only /pdf_preflight.so)
# * Packagist picks up the tag for the Composer package automatically
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-version.sh "${GITHUB_REF_NAME#v}"

  build:
    needs: verify
    uses: ./.github/workflows/build-extension.yml

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.so > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.so
            dist/SHA256SUMS

  images:
    needs: build
    name: Image PHP ${{ matrix.php }}${{ matrix.flavor.suffix }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        flavor:
          - { variant: cli-bookworm, suffix: '' }
          - { variant: zts-bookworm, suffix: '-zts' }
          - { variant: cli-alpine3.21, suffix: '-alpine' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pdf_preflight-php${{ matrix.php }}-${{ matrix.flavor.variant }}-x86_64
          path: in/amd64
      - uses: actions/download-artifact@v4
        with:
          name: pdf_preflight-php${{ matrix.php }}-${{ matrix.flavor.variant }}-aarch64
          path: in/arm64
      - name: Prepare build context
        run: |
          mkdir -p ctx/amd64 ctx/arm64
          cp in/amd64/*.so ctx/amd64/pdf_preflight.so
          cp in/arm64/*.so ctx/arm64/pdf_preflight.so
          cp LICENSE-MIT LICENSE-APACHE ctx/
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="php${{ matrix.php }}${{ matrix.flavor.suffix }}"
          {
            echo "tags<<EOT"
            echo "$IMAGE:$VERSION-$TAG"
            echo "$IMAGE:$(echo "$VERSION" | cut -d. -f1,2)-$TAG"
            echo "EOT"
          } >> "$GITHUB_OUTPUT"
        id: meta
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          file: docker/extension.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=pdf_preflight PHP extension for PHP ${{ matrix.php }}${{ matrix.flavor.suffix }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=${{ github.ref_name }}
