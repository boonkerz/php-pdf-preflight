[package]
name = "pdf_preflight"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Native PHP extension for analysing PDF print data (preflight)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pdf-analyze"
path = "src/bin/pdf_analyze.rs"
required-features = ["cli"]

[features]
default = ["php"]
# Builds the PHP bindings. Disable (`--no-default-features`) to test the pure
# Rust core without a PHP installation.
php = ["dep:ext-php-rs"]
# Command line tool for debugging and benchmarks (no PHP required).
cli = []

[dependencies]
# Zero-copy, lazily evaluated PDF parser. `images` is disabled: we only read
# image metadata and never decode pixel data.
hayro-syntax = { version = "0.8.0", default-features = false, features = ["std"] }
# Pure Rust inflate used for size-bounded stream decoding.
miniz_oxide = "0.9.1"
ext-php-rs = { version = "0.16.3", optional = true }
memchr = "2.8.0"
zune-jpeg = "0.5.15"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
# Panics must unwind so they can be caught before they reach the PHP engine.
panic = "unwind"
